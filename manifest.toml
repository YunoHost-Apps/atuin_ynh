#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "atuin"
name = "Atuin"
description.en = "Syncing and backing up encrypted shell history across devices"
description.fr = "Synchroniser et sauvegarder votre historique de shell chiffré entre vos appareils"

version = "18.22.0~ynh1"

maintainers = ["ximikos"]

[upstream]
license = "MIT"
website = "https://atuin.sh"
admindoc = "https://docs.atuin.sh/cli/self-hosting/server-setup/"
userdoc = "https://docs.atuin.sh/cli/"
code = "https://github.com/atuinsh/atuin"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = false

ldap = "not_relevant"
sso = "not_relevant"

disk = "500M"
ram.build = "50M"
ram.runtime = "100M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/atuin"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    amd64.url = "https://github.com/atuinsh/atuin/releases/download/v18.22.0/atuin-server-x86_64-unknown-linux-musl.tar.gz"
    amd64.sha256 = "679f3ac2f2e8e58f9d47f623834af0d979b4277f610a57db715f482b7dcae7e0"
    arm64.url = "https://github.com/atuinsh/atuin/releases/download/v18.22.0/atuin-server-aarch64-unknown-linux-musl.tar.gz"
    arm64.sha256 = "c5c9c6e66a18c8b36249b37e42305c03cdffc717eafaf936db1f6a01f01031ea"
    autoupdate.strategy = "latest_github_release"
    autoupdate.asset.amd64 = "^atuin-server-x86_64-unknown-linux-musl\\.tar\\.gz$"
    autoupdate.asset.arm64 = "^atuin-server-aarch64-unknown-linux-musl\\.tar\\.gz$"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    main.show_tile = false

    [resources.ports]
